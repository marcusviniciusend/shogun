name: testes

# Roda no que vira ou entra em dev e main. `dev` e a branch de integracao do
# projeto; `main` esta listada porque e para onde os PRs sao promovidos depois.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Um PR que recebe varios pushes seguidos nao precisa manter as execucoes
# antigas ocupando runner.
concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Uma versao falhando nao esconde o resultado da outra.
      fail-fast: false
      matrix:
        # 3.11 e o piso declarado no CLAUDE.md e no server/README.md; 3.13
        # guarda contra quebra nas versoes novas.
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        # O servidor nao e empacotado: o pytest.ini e o ajuste de sys.path do
        # conftest assumem que a suite roda a partir de server/.
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Instalar dependencias
        # requirements-dev.txt ja comeca com `-r requirements.txt`, entao um
        # arquivo so cobre runtime e teste.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar a suite
        # Sem variavel de ambiente nenhuma, de proposito: nenhum teste chama API
        # real nem toca banco de verdade. Se algum passar a precisar de segredo,
        # e sinal de que virou teste de integracao e nao deveria estar aqui.
        run: pytest
