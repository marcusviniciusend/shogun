[package]
name = "shogun-desktop"
version = "0.1.0"
description = "Cliente desktop do assistente Shogun"
authors = ["Shogun"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shogun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# fetch via Rust: evita CORS do webview e permite apontar para qualquer host
# (localhost ou IP Tailscale) sem configurar SHOGUN_ALLOWED_ORIGINS no servidor
tauri-plugin-http = "2"
# executa a ClientInstruction open_app; o escopo em capabilities/default.json
# fixa executavel e args por app — nada fora do mapa curado roda
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# motor de STT local (docs/stt-desktop-design.md): whisper.cpp em CPU via
# binding — sem feature de GPU DE PROPOSITO, a VRAM ja e do LLM local.
# Exige CMake + MSVC no build; com WHISPER_DONT_GENERATE_BINDINGS=1 os
# bindings pre-gerados do crate dispensam o libclang.
whisper-rs = "0.16"
# download do modelo ggml no primeiro uso, em streaming com progresso.
# Mesma versao que o tauri-plugin-http ja traz na arvore — custo marginal.
reqwest = "0.12"
# validacao de integridade (SHA-256) do modelo baixado
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
